<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Manager</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 DevOps Task Manager</h1>
            <p class="subtitle">Manage your tasks with status tracking</p>
        </header>

        <div class="form-section">
            <div class="form-group">
                <input type="text" id="taskInput" placeholder="Enter task title..." class="input-field">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <select id="statusSelect" class="input-field">
                        <option value="Not Started">Not Started</option>
                        <option value="Working">Working</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <button onclick="addTask()" class="btn btn-primary">+ Add Task</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Not Started:</span>
                <span class="stat-value stat-not-started" id="notStartedCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Working:</span>
                <span class="stat-value stat-working" id="workingCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Completed:</span>
                <span class="stat-value stat-completed" id="completedCount">0</span>
            </div>
        </div>

        <div class="tasks-section">
            <div id="taskList" class="task-list"></div>
            <div id="emptyState" class="empty-state">
                <p>📭 No tasks yet. Create one to get started!</p>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
