# ==============================================================================
# Kubernetes Deployment Manifest: devops-task-manager
# Rubric 4.4 Demonstration: Pod specification, replicas, rolling updates
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-manager
  labels:
    app: devops-task-manager
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-task-manager
  template:
    metadata:
      labels:
        app: devops-task-manager
    spec:
      containers:
      - name: task-manager
        image: devops-task-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
