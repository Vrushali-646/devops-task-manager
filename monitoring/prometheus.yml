# ==============================================================================
# Prometheus Scrape Configuration
# Rubric 4.5 Demonstration: scrape_interval, jobs, metrics endpoints
# ==============================================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Self-monitoring job for Prometheus metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Application monitoring job for DevOps Task Manager (/metrics endpoint)
  - job_name: 'devops-task-manager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.17.0.1:3000', 'localhost:3000', '172.17.0.1:30080', 'localhost:30080']
