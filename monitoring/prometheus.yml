global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: devops-task-manager
    metrics_path: /metrics
    static_configs:
      - targets: [localhost:3000]

  - job_name: kubernetes-cluster
    metrics_path: /k8s/metrics
    static_configs:
      - targets: [localhost:9999]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
